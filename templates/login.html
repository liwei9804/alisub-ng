<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alisub-ng 登录</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23667eea'/><text x='50' y='68' font-family='Arial,sans-serif' font-size='48' font-weight='bold' fill='white' text-anchor='middle'>AS</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-box h1{text-align:center;color:#333;margin-bottom:8px;font-size:24px}
.login-box .sub{text-align:center;color:#999;margin-bottom:32px;font-size:14px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px;font-weight:600}
.form-group input{width:100%;padding:10px 14px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
.form-group input:focus{border-color:#667eea}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{opacity:.9}
.error{background:#fff2f0;border:1px solid #ffccc7;color:#ff4d4f;padding:10px;border-radius:8px;margin-bottom:16px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="login-box">
  <h1>🎬 alisub-ng</h1>
  <p class="sub">阿里云盘订阅管理</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" action="/login">
    <div class="form-group">
      <label>👤 账号</label>
      <input type="text" name="username" placeholder="请输入账号" autofocus required>
    </div>
    <div class="form-group">
      <label>🔒 密码</label>
      <input type="password" name="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn btn-primary">登 录</button>
  </form>
</div>
</body>
</html>
